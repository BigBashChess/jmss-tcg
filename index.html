<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101D35"><link rel="icon" href="index_images/favicon.png">
<link rel="stylesheet" href="global.css"><title>Open a Pack | JMSS TCG</title>
<style>
.pack-stage{display:grid;place-items:center;min-height:425px;position:relative;isolation:isolate;overflow:hidden}
.pack-stage::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#3caee84a,transparent 65%);filter:blur(20px);z-index:-1}
.pack-click{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;perspective:800px;touch-action:manipulation}
.pack-click:focus-visible{outline:3px solid #65D6F4;outline-offset:8px;border-radius:16px}
.pack-art{display:block;object-fit:contain;height:365px;width:min(75vw,260px);filter:drop-shadow(0 15px 25px #040e1fa0);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.17,.67,.27,1.2),filter .55s}
.pack-art.flip{transform:rotateY(180deg) scale(1.06);filter:drop-shadow(0 0 30px #65D6F4)}
.pack-stage.opening .pack-art{animation:packReveal 2.2s ease-in-out forwards;pointer-events:none}
.pack-stage.opening::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffffffdb 0%,#65D6F4a8 12%,transparent 65%);animation:flashReveal 2s ease-out forwards;pointer-events:none}
.pack-stage.opened .pack-art{filter:drop-shadow(0 0 22px #f4c45b);transform:scale(1.03)}
@keyframes packReveal{0%{transform:rotateY(0deg) scale(1)}20%{transform:rotateY(360deg) scale(1.08)}45%{transform:rotateY(900deg) scale(1.2)}65%{transform:rotateY(1440deg) scale(.93)}83%{transform:rotateY(1800deg) scale(1.25)}100%{transform:rotateY(1800deg) scale(1.03)}}
@keyframes flashReveal{0%,25%{opacity:0}48%{opacity:.8}65%{opacity:0}82%{opacity:.85}100%{opacity:0}}
.pack-instructions{text-align:center;color:#9AB2C7;font-size:.96rem;min-height:24px}
.pack-progress{height:7px;max-width:270px;background:#294463;border-radius:999px;overflow:hidden;margin:16px auto}
.pack-progress div{background:linear-gradient(90deg,#1976B9,#65D6F4);height:100%;width:0;transition:width .3s ease}
.pack-reset{border:1px solid #65D6F4;background:#183B63;color:white;padding:10px 19px;border-radius:9px;cursor:pointer;font:inherit;display:none;margin:16px auto}
.pack-reset:hover{background:#1976B9}
@media(prefers-reduced-motion:reduce){.pack-art{transition:none}.pack-stage.opening .pack-art,.pack-stage.opening::after{animation:none}}
</style>
</head>
<body class="background">
<nav class="top-nav" aria-label="Main navigation"><a href="index.html"><img src="index_images/home_icon.png" alt="">Home</a><a href="collection.html"><img src="index_images/collection_icon.png" alt="">Collection</a><a href="sign_in_programmable.html">Sign in</a></nav>
<main class="site-main">
<section class="hero"><p class="eyebrow">JOHN MONASH SCIENCE SCHOOL</p><h1>JMSS Trading Card Game</h1><p class="subtext">Tap the pack to spin it and reveal a surprise.</p></section>
<section aria-label="Pack opening" class="hero">
<div class="pack-stage" id="pack-stage"><button type="button" id="pack-button" class="pack-click" aria-label="Rotate the JMSS card pack"><img id="pack-art" class="pack-art" src="index_images/cardpacks/common.png" alt="Blue JMSS TCG booster pack"></button></div>
<p id="pack-status" class="pack-instructions" aria-live="polite">Click the pack 6 times to open it!</p>
<div class="pack-progress" role="progressbar" aria-label="Progress to pack opening" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="pack-progress"><div id="pack-fill"></div></div>
<button type="button" class="pack-reset" id="pack-reset">Open another pack</button>
</section>
</main><nav class="bottom-nav"><a href="index.html">Home</a><a href="collection.html">Collection</a><a href="trade.html">Trade</a></nav>
<script>
(function(){
const maxClicks=6, stage=document.getElementById('pack-stage'), button=document.getElementById('pack-button'), art=document.getElementById('pack-art'),status=document.getElementById('pack-status'),progress=document.getElementById('pack-progress'),fill=document.getElementById('pack-fill'),reset=document.getElementById('pack-reset');
let clicks=0,rot=0,animating=false,opened=false;
button.addEventListener('click',function(){
 if(animating||opened)return;
 clicks++;rot+=360;
 art.style.transform='rotateY('+rot+'deg) scale(1.06)';
 setTimeout(()=>{if(!animating&&!opened)art.style.transform='rotateY('+rot+'deg)'},350);
 progress.setAttribute('aria-valuenow',String(clicks));fill.style.width=(clicks/maxClicks*100)+'%';
 if(clicks<maxClicks){status.textContent=(maxClicks-clicks)+' more '+(maxClicks-clicks===1?'click':'clicks')+' to open your pack!';return;}
 animating=true;button.disabled=true;status.textContent='Opening pack…';art.style.transform='';stage.classList.add('opening');
 setTimeout(function(){stage.classList.remove('opening');stage.classList.add('opened');art.src='index_images/cardpacks/common.png';art.alt='Common JMSS TCG booster pack';opened=true;animating=false;status.textContent='Pack opened! Five cards coming soon.';reset.style.display='block';},2200);
});
reset.addEventListener('click',function(){clicks=0;rot=0;opened=false;animating=false;art.src='index_images/cardpacks/common.png';art.alt='Blue JMSS TCG booster pack';art.style.transform='';button.disabled=false;stage.classList.remove('opening','opened');progress.setAttribute('aria-valuenow','0');fill.style.width='0';status.textContent='Click the pack 6 times to open it!';reset.style.display='none';});
})();
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101D35">
<link rel="icon" href="index_images/favicon.png">
<link rel="stylesheet" href="global.css">
<title>Open a Pack | JMSS TCG</title>
<style>
.pack-stage{display:grid;place-items:center;min-height:425px;position:relative;isolation:isolate;overflow:hidden}
.pack-stage::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#3caee84a,transparent 65%);filter:blur(20px);z-index:-1}
.pack-click{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;perspective:800px;touch-action:manipulation}
.pack-click:focus-visible{outline:3px solid #65D6F4;outline-offset:8px;border-radius:16px}
.pack-art{display:block;object-fit:contain;height:365px;width:min(75vw,260px);filter:drop-shadow(0 15px 25px #040e1fa0);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.17,.67,.27,1.2),filter .55s}
.pack-art.flip{transform:rotateY(180deg) scale(1.06);filter:drop-shadow(0 0 30px #65D6F4)}
.pack-stage.opening .pack-art{animation:packReveal 2.2s ease-in-out forwards;pointer-events:none}
.pack-stage.opening::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffffffdb 0%,#65D6F4a8 12%,transparent 65%);animation:flashReveal 2s ease-out forwards;pointer-events:none}
.pack-stage.opened .pack-art{filter:drop-shadow(0 0 22px #f4c45b);transform:scale(1.03)}
@keyframes packReveal{0%{transform:rotateY(0deg) scale(1)}20%{transform:rotateY(360deg) scale(1.08)}45%{transform:rotateY(900deg) scale(1.2)}65%{transform:rotateY(1440deg) scale(.93)}83%{transform:rotateY(1800deg) scale(1.25)}100%{transform:rotateY(1800deg) scale(1.03)}}
@keyframes flashReveal{0%,25%{opacity:0}48%{opacity:.8}65%{opacity:0}82%{opacity:.85}100%{opacity:0}}
.pack-instructions{text-align:center;color:#9AB2C7;font-size:.96rem;min-height:24px}
.pack-progress{height:7px;max-width:270px;background:#294463;border-radius:999px;overflow:hidden;margin:16px auto}
.pack-progress div{background:linear-gradient(90deg,#1976B9,#65D6F4);height:100%;width:0;transition:width .3s ease}
.pack-reset{border:1px solid #65D6F4;background:#183B63;color:white;padding:10px 19px;border-radius:9px;cursor:pointer;font:inherit;display:none;margin:16px auto}
.pack-reset:hover{background:#1976B9}
@media(prefers-reduced-motion:reduce){.pack-art{transition:none}.pack-stage.opening .pack-art,.pack-stage.opening::after{animation:none}}
.card-reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;max-width:1050px;margin:28px auto 12px;text-align:center}.card-reveal[hidden]{display:none}.reveal-card{animation:cardRise .55s ease both;min-width:0}.reveal-card img{display:block;width:100%;max-width:230px;margin:auto;border-radius:9px;box-shadow:0 12px 26px #0008}.reveal-card .missing-card{padding:25px 8px;border:1px solid #65D6F4;border-radius:10px;color:#9AB2C7}.pack-stage.opened{display:none}@keyframes cardRise{from{opacity:0;transform:translateY(30px) scale(.90)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){.reveal-card{animation:none}} 

/* Single-screen arcade home */
html,body{height:100%;overflow:hidden}body{padding:0!important}
.top-nav{height:66px;padding:0 max(14px,3vw);gap:10px;justify-content:space-between}
.top-nav .brand{font-weight:900;letter-spacing:.07em;color:#65D6F4;white-space:nowrap}
.nav-links{display:flex;align-items:center;justify-content:flex-end;gap:clamp(6px,2vw,22px)}
.nav-links a,.bottom-nav a{display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:11px;font-size:.91rem;white-space:nowrap}
.nav-links a:hover,.bottom-nav a:hover,.nav-links a.active,.bottom-nav a.active{background:#27618B;color:white}
.bottom-nav{height:68px;padding:8px 14px;gap:4px}
.arcade-main{position:fixed;top:66px;bottom:68px;left:0;right:0;width:100%;max-width:none;min-height:0;padding:clamp(8px,2vh,20px) 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.2vh,14px);overflow:hidden}
.arcade-hero{flex-shrink:0;text-align:center}
.arcade-hero h1{font-size:clamp(1.35rem,3vw,2.5rem);margin:2px 0 4px}
.arcade-hero .eyebrow{font-size:clamp(.56rem,.9vw,.8rem);margin:0}
.arcade-hero .subtext{margin:0;font-size:clamp(.73rem,1.1vw,.95rem)}
.arcade-play{width:100%;min-height:0;max-width:1250px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.2vh,12px)}
.pack-stage{min-height:0;flex:1;width:100%;overflow:hidden}
.pack-stage::before{width:min(36vh,320px);height:min(36vh,320px)}
.pack-art{height:min(48vh,390px);max-height:100%;width:auto;max-width:min(74vw,290px)}
.pack-click{height:100%;display:grid;place-items:center}
.pack-instructions{margin:0;font-size:clamp(.78rem,1.4vw,1rem);min-height:1.2em}
.pack-progress{margin:0;flex-shrink:0;width:min(270px,80vw)}
.pack-reset{margin:0 auto;flex-shrink:0;padding:9px 16px}
.card-reveal{width:100%;max-width:1150px;min-height:0;flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:clamp(5px,1vw,15px);overflow-x:auto;overflow-y:hidden;padding:6px 3px}
.reveal-card{flex:0 1 190px;min-width:0;max-height:100%;display:grid;place-items:center}
.reveal-card img{height:auto;max-height:min(47vh,420px);width:100%;object-fit:contain}
.card-reveal[hidden]{display:none}
@media(max-width:640px){.top-nav{height:56px}.top-nav .brand{font-size:.85rem}.nav-links{gap:2px}.nav-links a{font-size:.75rem;padding:7px}.nav-links a img{display:none}.bottom-nav{height:60px}.bottom-nav a{font-size:.73rem;padding:8px}.arcade-main{top:56px;bottom:60px;padding:8px}.arcade-hero .subtext{display:none}.pack-art{height:min(51dvh,360px)}.card-reveal{justify-content:flex-start;gap:7px}.reveal-card{flex:0 0 clamp(120px,39vw,175px)}.reveal-card img{max-height:42dvh}}
@media(max-height:540px){.arcade-hero .subtext,.arcade-hero .eyebrow{display:none}.arcade-hero h1{font-size:1.2rem}.arcade-main{gap:3px}.pack-art{height:45dvh}.pack-progress{height:5px}.card-reveal img{max-height:36dvh}}
</style>
<link rel="stylesheet" href="navigation.css">
<style>.arcade-main{top:var(--nav-top-h)!important;bottom:var(--nav-bottom-h)!important}.top-nav .nav-brand{font-weight:900}</style>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="pack-opening.css">
</head>
<body class="background">
<nav id="site-top-nav">
</nav>
<main class="arcade-main">
<section class="arcade-hero">
<p class="eyebrow">JOHN MONASH SCIENCE SCHOOL</p>
<h1>New card pack available</h1>
</section>
<section aria-label="Pack opening" class="arcade-play">
<div class="pack-stage" id="pack-stage">
<button type="button" id="pack-button" class="pack-click" aria-label="Rotate the JMSS card pack">
<img id="pack-art" class="pack-art" src="index_images/cardpacks/common.png" alt="Blue JMSS TCG booster pack">
</button>
</div>
<p id="pack-status" class="pack-instructions" aria-live="polite">Keep clicking the pack to open it!</p>
<div class="pack-progress" role="progressbar" aria-label="Progress to pack opening" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="pack-progress">
<div id="pack-fill">
</div>
</div>
<div id="card-reveal" class="card-reveal" aria-label="Five revealed cards" hidden>
</div>
<div class="reveal-controls">
<span id="reveal-counter" aria-live="polite">
</span>
<button type="button" id="skip-reveal" hidden>Reveal all cards</button>
</div>
<p id="reveal-summary" hidden data-saved="false">Cards added to your collection. <a href="collection.html" style="color:#8dcbe6">View collection →</a>
</p>
<button type="button" class="pack-reset" id="pack-reset">Open another pack</button>
</section>
</main>
<dialog id="card-detail" class="card-detail-dialog">
<form method="dialog">
<button class="card-detail-close" aria-label="Close card details">Close ×</button>
</form>
<div id="card-detail-body" class="card-detail-body">
</div>
</dialog>
<nav id="site-bottom-nav">
</nav>
<script src="pack-opening.js" defer>
</script>
<script src="navigation.js">
</script>
</body>
</html>

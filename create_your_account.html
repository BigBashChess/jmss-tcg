<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101D35"><link rel="icon" href="index_images/favicon.png"><link rel="stylesheet" href="global.css"><title>Create account | JMSS TCG</title><link rel="stylesheet" href="navigation.css"><style></style><link rel="stylesheet" href="design.css"></head><body class="background"><nav id="site-top-nav"></nav><main class="site-main auth-shell"><section class="auth-card"><p class="eyebrow">JMSS TCG</p><h1>Create your account</h1><p class="subtext">Create a player profile when accounts launch.</p><p class="auth-notice" role="status">Demo mode: enter any username, email and password to continue. No account information is saved.</p><form id="demo-auth" action="index.html" method="get"><label for="email">Email or username</label><input id="email" name="username" type="text" autocomplete="username" placeholder="Enter email or username" required><label for="name">Display name</label><input id="name" type="text" autocomplete="nickname" placeholder="What should we call you?" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Enter password" required><button type="submit">Sign up</button></form><script>document.getElementById('demo-auth').addEventListener('submit', function(event) {event.preventDefault(); if(this.reportValidity()) window.location.href='index.html';});</script><p class="form-foot">Already have an account? <a href="sign_in_programmable.html">Sign in</a></p></section></main><nav id="site-bottom-nav"></nav><script src="navigation.js"></script></body></html>

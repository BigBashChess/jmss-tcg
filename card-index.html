<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101D35">
  <link rel="icon" href="index_images/favicon.png">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="design.css">
  <title>Card Index | JMSS TCG</title>
  <style>
    .index-summary {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .index-stat {
      background: #183B63;
      border: 1px solid #34688D;
      border-radius: 13px;
      padding: 14px 24px;
      min-width: 140px;
      text-align: center;
    }
    .index-stat strong {
      display: block;
      color: #65D6F4;
      font-size: 1.6rem;
    }
    .index-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px auto 8px;
      max-width: 1050px;
    }
    .index-controls input, .index-controls select {
      min-width: 0;
      flex: 1 1 180px;
      padding: 11px 14px;
      border: 1px solid #45759A;
      border-radius: 9px;
      color: #fff;
      background: #183B63;
      font: inherit;
    }
    .index-controls input::placeholder { color: #C2D3E3; }
    .index-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 18px;
      max-width: 1050px;
      margin: 24px auto;
    }
    .index-card {
      position: relative;
      padding: 9px;
      min-width: 0;
      border: 1px solid #34688D;
      border-radius: 14px;
      background: #183B63;
      overflow: hidden;
    }
    .index-card .art {
      width: 100%;
      aspect-ratio: 5 / 7;
      border-radius: 8px;
      overflow: hidden;
      background: #050507;
    }
    .index-card .art img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .index-card.locked { background: #090B12; border-color: #414A5C; }
    .index-card.locked .art {
      display: grid;
      place-items: center;
      color: #fff;
      font-size: clamp(3rem, 5vw, 5rem);
      font-weight: 900;
    }
    .index-card .card-title {
      margin: 10px 2px 2px;
      color: #F2F8FC;
      font-size: .82rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .index-card .card-number {
      display: block;
      margin: 3px 2px;
      font-size: .7rem;
      color: #ABC6D9;
    }
    .index-card .count {
      position: absolute;
      top: 13px;
      right: 13px;
      padding: 4px 8px;
      background: #f4c45b;
      color: #101D35;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 800;
      box-shadow: 0 2px 9px #0008;
    }
    .index-message {
      text-align: center;
      color: #C2D3E3;
      margin: 14px auto;
    }
    @media (max-width: 480px) {
      .index-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .index-controls { gap: 8px; }
      .index-card { padding: 7px; }
    }
  </style>
</head>
<body class="background">
  <nav id="site-top-nav"></nav>
  <main class="site-main">
    <section class="hero">
      <p class="eyebrow">JMSS TRADING CARD GAME</p>
      <h1>Card Index</h1>
      <p class="subtext" id="index-description">Browse the cards. Discover a card by opening packs to reveal its artwork.</p>
      <div class="index-summary">
        <div class="index-stat"><strong id="unique-count">0 / 0</strong>Discovered cards</div>
        <div class="index-stat"><strong id="total-count">0</strong>Total cards owned</div>
      </div>
      <a class="button" href="index.html">Open packs</a>
      <a class="button" href="collection.html">My Collection</a>
    </section>

    <div class="index-controls" aria-label="Filter cards">
      <input id="card-search" type="search" placeholder="Search by name or card number" aria-label="Search card index">
      <select id="rarity-filter" aria-label="Filter by rarity">
        <option value="all">All rarities</option>
        <option value="Rare">Rare</option>
        <option value="Legendary">Legendary</option>
        <option value="Mythic">Mythic</option>
        <option value="Divine">Divine</option>
        <option value="Unassigned">Unassigned</option>
      </select>
      <select id="ownership-filter" aria-label="Filter by ownership">
        <option value="all">All cards</option>
        <option value="owned">Discovered only</option>
        <option value="locked">Undiscovered only</option>
      </select>
    </div>
    <p id="collection-notice" class="index-message" role="status" aria-live="polite"></p>
    <section id="collection-grid" class="index-grid" aria-label="All cards"></section>
  </main>
  <nav id="site-bottom-nav"></nav>

  <script>
    (async function () {
      const grid = document.getElementById("collection-grid");
      const notice = document.getElementById("collection-notice");
      const search = document.getElementById("card-search");
      const rarityFilter = document.getElementById("rarity-filter");
      const ownershipFilter = document.getElementById("ownership-filter");
      let records = [];
      let inventory = {};

      // Loads every card in the database.
      try {
        const response = await fetch("cards.json", { cache: "no-cache" });
        if (!response.ok) throw new Error("Card database unavailable");
        records = await response.json();
        if (!Array.isArray(records)) throw new Error("Invalid card database");
      } catch (error) {
        notice.textContent = "The card database could not be loaded. Please refresh.";
        return;
      }

      // Reads saved cards from this browser.
      try {
        const saved = JSON.parse(localStorage.getItem("jmss-tcg-collection-v1") || "{}");
        if (saved && typeof saved === "object" && !Array.isArray(saved)) inventory = saved;
      } catch (error) {
        notice.textContent = "Saved cards could not be read in this browser.";
      }

      const countFor = file => {
        const count = Number(inventory[file]);
        return Number.isSafeInteger(count) && count > 0 ? count : 0;
      };

      let discovered = 0;
      let total = 0;
      for (const card of records) {
        const count = card.image ? countFor(card.image) : 0;
        if (count > 0) {
          discovered++;
          total += count;
        }
      }
      document.getElementById("unique-count").textContent = discovered + " / " + records.length;
      document.getElementById("total-count").textContent = total.toLocaleString();
      document.getElementById("index-description").textContent =
        records.length + " cards in the Index. Undiscovered cards stay hidden.";

      // Keeps undiscovered artwork hidden and displays owned cards.
      function render() {
        const term = search.value.trim().toLowerCase();
        const rarity = rarityFilter.value;
        const ownership = ownershipFilter.value;
        const fragment = document.createDocumentFragment();
        let matches = 0;

        for (const card of records) {
          const count = card.image ? countFor(card.image) : 0;
          const owned = count > 0;
          if (rarity !== "all" && card.rarity !== rarity) continue;
          if (ownership === "owned" && !owned) continue;
          if (ownership === "locked" && owned) continue;

          // Search undiscovered cards only by their number, not hidden names.
          const searchable = owned
            ? (card.id + " " + card.name + " " + (card.subtitle || "")).toLowerCase()
            : String(card.id).toLowerCase();
          if (term && !searchable.includes(term)) continue;

          matches++;
          const tile = document.createElement("article");
          tile.className = "index-card" + (owned ? "" : " locked");
          const art = document.createElement("div");
          art.className = "art";

          if (owned) {
            const image = document.createElement("img");
            image.src = "cards/" + card.image;
            image.alt = card.name;
            image.loading = "lazy";
            art.append(image);

            const badge = document.createElement("span");
            badge.className = "count";
            badge.textContent = "×" + count;
            tile.append(badge);
          } else {
            art.textContent = "?";
            art.setAttribute("aria-label", "Undiscovered card");
          }

          const number = document.createElement("small");
          number.className = "card-number";
          number.textContent = "Card #" + card.id;

          const title = document.createElement("div");
          title.className = "card-title";
          title.textContent = owned
            ? card.name + (card.subtitle ? " - " + card.subtitle : "")
            : "Unknown card";

          tile.append(art, number, title);
          fragment.append(tile);
        }
        grid.replaceChildren(fragment);
        notice.textContent = matches
          ? "Showing " + matches + " of " + records.length + " cards"
          : "No cards match these filters.";
      }

      search.addEventListener("input", render);
      rarityFilter.addEventListener("change", render);
      ownershipFilter.addEventListener("change", render);
      render();
    })();
  </script>
  <script src="navigation.js"></script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101D35"><link rel="icon" href="index_images/favicon.png"><link rel="stylesheet" href="global.css"><title>Trading Room | JMSS TCG</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding-bottom:0!important;color:#F2F8FC}
.trade-top{height:58px;background:#183B63;border-bottom:1px solid #3678a5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 19px}
.trade-top a{color:#F2F8FC;text-decoration:none;font-weight:700}.trade-top .room-title{font-weight:900;letter-spacing:.06em;color:#65D6F4}.trade-top .pill{font-size:.76rem;padding:7px 11px;border:1px solid #4388B4;border-radius:999px;color:#ACD8EE}
.trade-layout{height:calc(100dvh - 58px);max-width:1380px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:16px;padding:14px;min-height:0}
.trade-board{display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);gap:12px;min-height:0}
.trade-panel{background:linear-gradient(145deg,#214F85,#1C3767);border:1px solid #4179AB;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.trade-panel.mine{background:linear-gradient(145deg,#1A5279,#152F55)}
.panel-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800;font-size:.92rem}.panel-head small{color:#AFCDE2;font-weight:500;font-size:.75rem}
.offer-list{display:flex;gap:9px;align-items:center;justify-content:center;flex:1;min-height:0}
.offer-slot{width:min(30%,132px);height:100%;max-height:174px;min-height:80px;aspect-ratio:3/4;background:#142847;border:1.5px dashed #75B9DB;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.offer-slot img{height:100%;width:100%;object-fit:contain}.offer-slot button{position:absolute;top:2px;right:2px;border:0;border-radius:8px;color:white;background:#9C284C;cursor:pointer;font-size:.78rem;padding:5px 7px}
.offer-slot .slot-label{color:#92B5CE;font-size:.7rem;text-align:center;padding:6px}
.trade-actions{display:flex;gap:10px;justify-content:center;align-items:center}
.trade-actions button,.chat-actions button{border:1px solid #518DB5;border-radius:10px;padding:11px 18px;background:#2378AD;color:white;font-weight:800;cursor:pointer}
.trade-actions .decline{background:#6A2B65;border-color:#AD5BBA}.trade-actions .accept{background:#176F69;border-color:#53C4B6}
.trade-actions button:hover,.chat-actions button:hover{filter:brightness(1.17)}
.trade-side{display:flex;flex-direction:column;gap:12px;min-height:0}
.side-card{background:#142C4C;border:1px solid #3C668A;border-radius:14px;padding:12px;min-height:0}
.side-title{font-weight:800;margin:0 0 9px;font-size:.95rem}
.inventory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;overflow:auto;max-height:min(39dvh,360px);padding:2px}
.inventory button{position:relative;border:1px solid #476989;border-radius:8px;padding:3px;background:#1D426B;cursor:pointer;aspect-ratio:3/4;min-width:0}
.inventory button:disabled{cursor:not-allowed;opacity:.35}
.inventory img{display:block;width:100%;height:100%;object-fit:contain}
.inventory .qty{position:absolute;right:1px;top:1px;color:#16243A;background:#F4C45B;font-size:.67rem;font-weight:900;border-radius:10px;padding:2px 4px}
.chat-log{display:flex;flex:1;flex-direction:column;gap:7px;min-height:90px;max-height:25dvh;overflow:auto;padding:8px;background:#0E1E35;border-radius:10px}
.chat-msg{font-size:.8rem;padding:7px 10px;border-radius:10px;background:#244B74;align-self:flex-start;max-width:95%}.chat-msg.mine{align-self:flex-end;background:#205E7B}
.chat-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.chat-presets button{font-size:.72rem;text-align:center;padding:8px 4px;background:#28496F;border:1px solid #5086AA;border-radius:9px;color:white;cursor:pointer}
.chat-presets button:hover{background:#3477A7}
.trade-toast{font-size:.78rem;text-align:center;color:#B9D5E8;min-height:1em}
@media(max-width:850px){.trade-layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(185px,36dvh);gap:8px;padding:8px}.trade-side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.inventory{max-height:27dvh}.chat-log{max-height:15dvh}.trade-board{gap:6px}.trade-panel{padding:8px}.offer-slot{max-height:130px}.trade-actions button{padding:8px 12px}}
@media(max-width:490px){.trade-top{height:49px;padding:0 9px;font-size:.83rem}.trade-layout{height:calc(100dvh - 49px);grid-template-rows:minmax(0,1fr) minmax(0,38dvh)}.trade-side{grid-template-columns:1fr 1fr;gap:6px}.side-card{padding:7px}.inventory{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.chat-presets{gap:3px}.chat-presets button{font-size:.64rem;padding:5px 2px}.chat-log{min-height:70px}.offer-slot{max-height:110px}.panel-head{font-size:.76rem}.panel-head small{font-size:.65rem}}
</style>
</head>
<body class="background">
<header class="trade-top"><a href="index.html" aria-label="Return to homepage">← Home</a><span class="room-title">⇄ TRADE ROOM</span><a href="collection.html?v=2">Collection</a><span class="pill">DEMO</span></header>
<main class="trade-layout">
<section class="trade-board" aria-label="Trading table">
<div class="trade-panel">
<div class="panel-head"><span>🤖 Demo partner's offer</span><small>Example cards — not a real player</small></div>
<div class="offer-list" id="partner-offer"></div>
</div>
<div><div class="trade-actions"><button class="accept" type="button" id="accept">✓ Accept</button><button class="decline" type="button" id="decline">✕ Decline</button></div><div class="trade-toast" id="trade-status" role="status" aria-live="polite">Select up to 3 cards from your collection</div></div>
<div class="trade-panel mine"><div class="panel-head"><span>🃏 Your offer</span><small id="offer-count">0 / 3 cards</small></div><div class="offer-list" id="my-offer"></div></div>
</section>
<aside class="trade-side">
<section class="side-card"><h2 class="side-title">Your cards <span id="owned-summary" style="font-weight:400;color:#AFCDE2;font-size:.8rem"></span></h2><div id="inventory" class="inventory" aria-label="Choose cards to offer"></div><p style="font-size:.74rem;color:#AFCDE2;margin:8px 0 0">Tap a card to add it. Remove a card from your offer to choose another.</p></section>
<section class="side-card" style="display:flex;flex-direction:column"><h2 class="side-title">Quick Chat <span style="font-size:.68rem;color:#AFCDE2;font-weight:400">Preset messages</span></h2><div class="chat-log" id="chat-log" aria-live="polite"></div><div class="chat-presets" id="chat-presets"></div></section>
</aside></main>
<script>
(function(){
const cards=[
["Flush Sac Anderson","flush-sac-anderson.webp"],["Algorithm Albrecht","algorithm-albrecht.webp"],["Stephen Finchy","stephen-finchy.webp"],["Peter Thompson","peter-thompson.webp"],["Vincenzo Piscioneri","vincenzo-piscioneri.webp"],["Romanian Gavrilescu","romanian-gavrilescu.webp"],["Rimkevicius","rimkevicius.webp"],["Scott Chittleborough","scott-chittleborough.webp"],["Kermond","kermond.webp"],["Rainy Xia","rainy-xia.webp"],["Sunny Xia","sunny-xia.webp"],["Muppet Finchy","muppet-finchy.webp"],["Dr Driscoll","dr-driscoll.webp"],["Danger Grainger","danger-grainger.webp"],["Gen Z Clarke","gen-z-clarke.webp"],["Bonehead Kermond","bonehead-kermond.webp"]];
const key='jmss-tcg-collection-v1';
let saved={};try{const parsed=JSON.parse(localStorage.getItem(key)||'{}');if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))saved=parsed;}catch(e){}
const count=file=>{const n=Number(saved[file]);return Number.isSafeInteger(n)&&n>0?n:0};
const offer=[],partnerCards=[cards[1],cards[9],cards[12]];
const inventory=document.getElementById('inventory'),mine=document.getElementById('my-offer'),partner=document.getElementById('partner-offer'),status=document.getElementById('trade-status');
function tile(card,remove,index){const box=document.createElement('div');box.className='offer-slot';if(!card){const t=document.createElement('span');t.className='slot-label';t.textContent='EMPTY SLOT';box.append(t);return box;}const img=document.createElement('img');img.src='cards/'+card[1];img.alt=card[0];img.title=card[0];box.append(img);if(remove){const b=document.createElement('button');b.type='button';b.textContent='✕';b.setAttribute('aria-label','Remove '+card[0]);b.addEventListener('click',()=>{offer.splice(index,1);render();});box.append(b);}return box;}
function render(){partner.replaceChildren();mine.replaceChildren();for(let i=0;i<3;i++){partner.append(tile(partnerCards[i],false,i));mine.append(tile(offer[i],true,i));}document.getElementById('offer-count').textContent=offer.length+' / 3 cards';inventory.replaceChildren();let owned=0;cards.forEach(card=>{const n=count(card[1]);if(!n)return;owned++;const b=document.createElement('button');b.type='button';b.title=card[0]+' (×'+n+')';b.disabled=offer.length>=3||offer.filter(c=>c[1]===card[1]).length>=n;const img=document.createElement('img');img.src='cards/'+card[1];img.alt=card[0];const qty=document.createElement('span');qty.className='qty';qty.textContent='×'+n;b.append(img,qty);b.addEventListener('click',()=>{offer.push(card);status.textContent=card[0]+' added to your offer';render();});inventory.append(b);});document.getElementById('owned-summary').textContent='('+owned+' unique)';if(!owned){const p=document.createElement('p');p.style.cssText='grid-column:1/-1;color:#C7DAE9;font-size:.8rem';p.textContent='No cards collected yet. Open packs first!';inventory.append(p);}}
function chat(message,me=true){const log=document.getElementById('chat-log');const row=document.createElement('div');row.className='chat-msg'+(me?' mine':'');row.textContent=(me?'You: ':'Demo partner: ')+message;log.append(row);log.scrollTop=log.scrollHeight;}
const presets=['Hello!','Nice card!','Good luck!','Can you add more?','Fair trade?','Thanks!','I agree.','No thanks.'];
const presetBox=document.getElementById('chat-presets');presets.forEach(message=>{const b=document.createElement('button');b.type='button';b.textContent=message;b.addEventListener('click',()=>chat(message));presetBox.append(b);});
chat('Hi! Want to trade?',false);
document.getElementById('accept').addEventListener('click',()=>{if(!offer.length){status.textContent='Add at least one of your cards first.';return;}status.textContent='Trade accepted (demo only). No cards were transferred.';chat('Deal!',false);});
document.getElementById('decline').addEventListener('click',()=>{offer.splice(0);render();status.textContent='Trade declined. Your cards are unchanged.';chat('No problem!',false);});
render();
})();
</script></body></html>

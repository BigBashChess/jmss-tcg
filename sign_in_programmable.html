<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body class="background">
<nav id="site-top-nav">
</nav>
<main class="site-main auth-shell">
<section class="auth-card">
<p class="eyebrow">JMSS TCG</p>
<h1>Sign in</h1>
<p class="subtext">Access your collection when accounts launch.</p>
<p class="auth-notice" role="status">Demo mode: enter any username or email and password to continue. No account information is saved.</p>
<form id="demo-auth" action="index.html" method="get">
<label for="email">Username or email</label>
<input id="email" name="username" type="text" autocomplete="username" placeholder="Enter username or email" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
<button type="submit">Sign in</button>
</form>
<script>document.getElementById('demo-auth').addEventListener('submit', function(event) {event.preventDefault(); if(this.reportValidity()) window.location.href='index.html';});</script>
<p class="form-foot">New here? <a href="create_your_account.html">Create an account</a>
</p>
</section>
</main>
<nav id="site-bottom-nav">
</nav>
<script src="navigation.js">
</script>
</body>
</html>
